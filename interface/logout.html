<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bruce - Logged Out</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --color: #ff3ec8;
      --bg: #1a1a2e;
      --surface: #1e1e38;
      --border: color-mix(in srgb, var(--color) 25%, #333);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--color);
      font-family: "JetBrains Mono", "Fira Code", "DejaVu Sans Mono", "Consolas", monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      padding: 32px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card h1 { font-size: 1.4rem; margin-bottom: 8px; }
    .card p { font-size: 0.85rem; opacity: 0.7; margin-bottom: 24px; line-height: 1.5; }
    .card a {
      display: inline-block;
      color: var(--color);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 8px 24px;
      border-radius: 6px;
      font-size: 0.85rem;
      transition: all 0.15s ease;
    }
    .card a:hover {
      background: var(--color);
      color: var(--bg);
    }
    .logo {
      font-size: 2.5rem;
      margin-bottom: 12px;
      font-weight: 700;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">BRUCE</div>
    <h1>Logged Out</h1>
    <p>You have been successfully logged out of the WebUI.</p>
    <a href="/">Log In Again</a>
  </div>
</body>
</html>
